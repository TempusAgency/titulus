# Titulus card layout — segment & token configuration.
#
# Edit this file by hand in any text editor. No build step, no external tools.
# BOTH renderers read this SAME file, so a change here shows up identically in:
#   - design/render.py   (the design/demo renderer — `design/demo.sh`, `design/watch.sh`)
#   - statusline.sh       (the production Claude Code status line)
#
# After editing, verify the card is still valid:
#   python3 design/render.py --verify     (must say PASS for every state)
#   python3 design/render.py --audit      (must say "0 violations")
#
# ---------------------------------------------------------------------------
# FORMAT (plain text, one directive per line — not JSON, no parser needed):
#
#   # comment                        — blank lines and lines starting with # are ignored
#   order: <segment> <segment> ...   — segment order, top to bottom (must list all 4)
#   [<segment>]                      — opens a segment block; one of: role / id / engine / place
#   tokens: <tok> <tok> ...          — tokens shown in this segment at normal width, in order
#   narrow_tokens: <tok> <tok> ...   — tokens shown instead, when width < 60 cells (optional;
#                                       if omitted, `tokens:` is used at every width)
#   active: never | busy             — does this segment's rails/highlight light up when the
#                                       session is busy (running agents/workflow/.working marker)?
#                                       Only ONE segment should normally be `busy` — REFERENCE.md's
#                                       approved frames highlight `engine`.
#   narrow_layout: inline | split    — place segment only. `split`: at narrow width, the path
#                                       moves to its own line under dir/branch. `inline`: path
#                                       always stays on the same line as dir/branch (may truncate
#                                       harder). Ignored by other segments.
#
# TOKEN CATALOGUE (fixed — you pick WHICH tokens appear and in WHAT ORDER, not their glyph/label):
#   role     role text, word-wrapped, hang-indented            — role segment only
#   id       activity glyph + session id                       — id segment only
#   ctx      ◷ CTX N%                                           — id segment
#   rl5      ◴ 5h N%  (5-hour rate-limit usage)                 — id segment
#   eta5     ↺ <eta>  (time left in the 5h window)               — id segment
#   rl7      ◴ 7d N%  (7-day rate-limit usage)                  — id segment
#   eta7     ↺ <Nd>   (time left in the 7d window)               — id segment
#   model    ◆ <model name>                                      — engine segment
#   effort   ↯ <effort level>                                    — engine segment
#   pr       ⇄ PR #N <state>   — only shown when a PR is open    — engine segment
#   agents   <spinner> agents ×N — only shown while subagents run — engine segment
#   wf       ⚙ wf ×N            — only shown while a workflow runs — engine segment
#   coord    ⇅ coord            — only shown when coord mail exists — engine segment
#   dir      ⌂ <folder name>                                     — place segment
#   branch   ↱ <branch>                                          — place segment
#   path     ↳ <path>  (always rendered last within its entry)   — place segment
#
# A token that has no value for the current render (e.g. `pr` with no open PR) is simply
# skipped — it does not leave a gap. Unknown tokens are ignored (both renderers just skip them),
# so a typo silently drops a chip rather than crashing the card — check `--verify`/`--audit`
# after editing to be sure the drop was intended.
#
# NOT configurable here (kept structural, protected by REFERENCE.md/--verify):
#   - the activity glyph itself (✻ calm / ✦✶✷✸✹✺ busy) always prefixes role and id
#   - box-drawing, corner glyphs, colours, the narrow-width threshold (60 cells), the
#     160-character role cap — these are the approved contract, not layout choices
# ---------------------------------------------------------------------------

order: role id engine place

[role]
tokens: role
active: never

[id]
tokens: id ctx rl5 eta5 rl7 eta7
narrow_tokens: id ctx
active: never

[engine]
tokens: model effort pr agents wf coord
active: busy

[place]
tokens: dir branch path
narrow_layout: split
active: never
